services:
  api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ai-band-generate-module:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8010
    ports:
      - "${APP_PORT:-8010}:8010"
    volumes:
      - ./output:/app/output
      - ./assets/rvc:/app/assets/rvc:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
