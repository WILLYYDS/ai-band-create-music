services:
  api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ai-band-generate-module:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      # Demucs 通过 HuggingFace 取模型配置；官方域名本机不可达，走镜像并把缓存放进挂载目录
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /app/output/.hf-cache
      # 新增：走 SSH 反向隧道到你本机的 7897
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
      NO_PROXY: localhost,127.0.0.1,::1,hf-mirror.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8010}:8010"
    volumes:
      - ./output:/app/output
      - ./assets/rvc:/app/assets/rvc:ro
      # Demucs 的 torch 缓存在应用里是硬编码路径，挂载持久目录避免容器重建后权限失败
      - ./output/.torch-cache:/app/.torch-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]